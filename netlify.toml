# Configuration Netlify pour KONGRUANS

[build]
  # Pas de processus de build nécessaire car c'est du HTML pur
  publish = "."

[[redirects]]
  # Toutes les routes redirigent vers index.html pour le fonctionnement SPA
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Headers de sécurité et performance
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Cache pour les assets
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
